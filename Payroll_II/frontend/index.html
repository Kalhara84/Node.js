<!doctype html>
<!-- Browser entry page: TypeScript builds the screens inside this page. -->
<html lang="en">
  <head>
    <!-- Use UTF-8 so text characters display correctly. -->
    <meta charset="UTF-8" />
    <!-- Show this icon in the browser tab. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Match the page width to the device for responsive layouts. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Set the browser tab title. -->
    <title>Mike Flora - Attendance &amp; Payroll System</title>
    <!-- Prepare connections used to download the page font. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load the Inter font used by the app theme. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- The router places Login, Dashboard and other screens inside this container. -->
    <div id="root"></div>
    <!-- Start main.ts, which loads styles and runs app.ts. -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
